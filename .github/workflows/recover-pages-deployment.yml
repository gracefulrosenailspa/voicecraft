name: Recover stale VoiceCraft Pages deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-pages-deployment.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stale Pages deployment
        uses: actions/github-script@v8
        with:
          script: |
            const pagesDeploymentId = 'f91ec33a759e8e979bbe2e4464f9cc7c28b8a8d6';
            try {
              await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: pagesDeploymentId,
                  headers: { 'X-GitHub-Api-Version': '2022-11-28' }
                }
              );
              core.info('Cancelled the stale queued Pages deployment.');
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info('The stale deployment is already finished or no longer cancellable.');
              } else {
                throw error;
              }
            }
