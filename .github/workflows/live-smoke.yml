name: VoiceCraft deployed-site smoke test

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test the published GitHub Pages site
        env:
          VOICECRAFT_TEST_URL: https://gracefulrosenailspa.github.io/voicecraft/
        run: node scripts/browser-smoke.mjs
