name: VoiceCraft validation

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check worker syntax
        run: |
          node --check service-worker.js
          node --check relay/worker.js
      - name: Validate app structure and inline scripts
        run: node scripts/validate.mjs
